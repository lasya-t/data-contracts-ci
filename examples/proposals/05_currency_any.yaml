# proposal: accept any currency code
name: orders
version: 1.3.0
owner: checkout-team
fields:
  order_id:
    type: string
    required: true
    pattern: ^O[0-9]{7}$
  customer_id:
    type: string
    required: true
  created_at:
    type: datetime
    required: true
  status:
    type: string
    required: true
    enum:
    - placed
    - paid
    - shipped
    - cancelled
    - returned
  amount:
    type: number
    required: true
    min: 0
  currency:
    type: string
    required: true
  channel:
    type: string
    required: true
    enum:
    - web
    - app
    - store
    - call_center
  promo_code:
    type: string
    required: false
  device_sku:
    type: string
    required: false
